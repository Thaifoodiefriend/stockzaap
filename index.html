<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAAP Dashboard V20 Weekly Forecast Dates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ec0001;--yellow:#ffc400;--green:#006149;--blue:#2457d6;--black:#0d1014;--bg:#eef1f4;--panel:#fff;--line:#e3e7eb;--muted:#808995}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(236,0,1,.06),transparent 24%),var(--bg);font-family:"Prompt",Arial,sans-serif;color:var(--black);font-weight:400}
.wrap{max-width:1680px;margin:auto;padding:14px 18px 32px}
.hero{background:linear-gradient(125deg,#090b0e,#171b20 70%,#250708);color:#fff;border-radius:23px;padding:17px 20px;box-shadow:0 18px 55px rgba(0,0,0,.16)}
.hero-top{display:flex;justify-content:space-between;gap:18px;align-items:center}.eyebrow{font-size:9px;color:#9fa8b2;letter-spacing:1.2px}h1{font-size:27px;font-weight:500;margin:4px 0 0}.live{font-size:11px;text-align:right;color:#dce1e6}.live b{color:#55e7a0;font-weight:500}
.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}button{font:inherit}.btn{border:0;border-radius:10px;padding:8px 11px;font-size:10px;font-weight:500;cursor:pointer}.btn.sync{background:var(--yellow)}.btn.api{background:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.35fr;gap:8px;margin-top:11px}.field{background:#fff;border:1px solid var(--line);border-radius:13px;padding:7px 10px}.field label{display:block;font-size:8px;color:var(--muted);margin-bottom:2px}.field input,.field select{width:100%;border:0;outline:0;background:#fff;font:inherit;font-size:11px}
.loading{margin-top:11px;padding:14px;border:1px solid var(--line);background:#fff;border-radius:15px;font-size:11px}.error{border-color:#ffb8b8;background:#fff4f4}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}.kpi{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;box-shadow:0 8px 30px rgba(16,24,40,.045)}.kpi .l{font-size:8px;color:var(--muted)}.kpi .v{font-size:26px;font-weight:600;margin-top:3px;letter-spacing:-.7px}.kpi.red{border-left:3px solid var(--red)}.kpi.green{border-left:3px solid var(--green)}.kpi.blue{border-left:3px solid var(--blue)}.kpi.yellow{border-left:3px solid var(--yellow)}
.section{margin-top:13px}.title{font-size:14px;font-weight:500;margin:0 0 8px}.sub{font-size:8px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.6fr .8fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:0 10px 35px rgba(16,24,40,.045)}.panel h3{font-size:11px;font-weight:500;margin:0 0 8px}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.insight{background:#111419;color:#fff;border-radius:14px;padding:11px 12px}.insight .k{font-size:7px;color:#9ba5af}.insight .v{font-size:14px;font-weight:500;margin-top:4px}.insight .s{font-size:8px;color:#b8c0c9;margin-top:2px}
.chart{height:310px;position:relative}svg{width:100%;height:100%;overflow:visible}.legend{display:flex;gap:12px;font-size:8px;color:#69727d;margin-bottom:7px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.channels{display:grid;gap:7px}.channel{background:#f7f8fa;border:1px solid #edf0f2;border-radius:12px;padding:9px}.crow{display:flex;justify-content:space-between;gap:8px}.cname{font-size:9px;font-weight:500}.cnum{font-size:15px;font-weight:600}.bar{height:5px;background:#e8ebef;border-radius:99px;margin-top:6px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--red),#ff5a5a);border-radius:99px;animation:grow .7s ease}@keyframes grow{from{width:0}}.cmeta{font-size:8px;color:#7c8590;margin-top:5px}
.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cmp{background:#f8f9fb;border:1px solid #edf0f2;border-radius:11px;padding:9px}.cmp .v{font-size:16px;font-weight:600}.cmp .l{font-size:7px;color:#7d8792}.delta{font-size:8px;margin-top:3px}.up{color:#087a45}.down{color:#c62828}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-items:end;height:165px}.fstep{text-align:center}.fbar{border-radius:10px 10px 3px 3px;background:#222831;color:#fff;display:flex;align-items:end;justify-content:center;padding:6px;font-size:11px;font-weight:600;min-height:32px}.fstep:nth-child(2) .fbar{background:var(--blue)}.fstep:nth-child(3) .fbar{background:var(--green)}.fstep:nth-child(4) .fbar{background:var(--red)}.flabel{font-size:7px;color:#78828d;margin-top:4px}
.ranklist{display:grid;gap:7px}.rank{display:grid;grid-template-columns:20px 1fr 65px;gap:7px;align-items:center}.rn{width:20px;height:20px;background:#eef0f3;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px}.rname{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rval{font-size:10px;font-weight:600;text-align:right}.rbar{height:6px;background:#eef0f2;border-radius:99px;margin-top:3px;overflow:hidden}.rfill{height:100%;background:linear-gradient(90deg,var(--red),#ff7777);border-radius:99px}
.forecast{background:linear-gradient(135deg,#101318,#191d23);color:#fff;border-radius:19px;padding:14px}.forecast-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.fc{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:10px}.fcstatus{font-size:8px;color:#b8c0c9}.fcname{font-size:9px;line-height:1.45;min-height:27px;margin-top:3px}.fcg{font-size:19px;font-weight:600;margin-top:6px}.fcmeta{font-size:7px;color:#9fa9b3}.spark{display:flex;align-items:end;gap:2px;height:25px;margin-top:7px}.spark i{flex:1;background:rgba(255,255,255,.3);border-radius:2px 2px 0 0}.fcrange{border-top:1px solid rgba(255,255,255,.08);margin-top:7px;padding-top:6px;font-size:8px;color:#bcc4cd}
.heatwrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:4px;font-size:8px}th{font-weight:400;color:#747e89}td{padding:7px;text-align:center;background:#f3f5f7;border-radius:6px}td:first-child{text-align:left;min-width:160px;background:transparent}.h1{background:#fff0f0}.h2{background:#ffdede}.h3{background:#ffbaba}.h4{background:#ff8585}.h5{background:#ec0001;color:#fff}
.product-tools{display:grid;grid-template-columns:1fr 140px;gap:7px;margin-bottom:8px}.product-tools input,.product-tools select{border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:9px}.products{display:grid;grid-template-columns:1fr 1.2fr;gap:9px}.plist{max-height:430px;overflow:auto;display:grid;gap:5px}.pitem{background:#f8f9fb;border:1px solid #edf0f2;border-radius:10px;padding:8px;cursor:pointer}.pitem.active{border-color:#111;background:#fff}.prow{display:flex;justify-content:space-between;gap:8px}.pname{font-size:8px}.pq{font-size:10px;font-weight:600}.pdetail{background:#f7f8fa;border-radius:13px;padding:11px}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.m{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.m .v{font-size:16px;font-weight:600}.m .l{font-size:7px;color:#7c8691}
@media(max-width:1050px){.grid2,.grid3{grid-template-columns:1fr}.forecast-grid{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr}}
@media(max-width:720px){.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.insights{grid-template-columns:1fr}.forecast-grid{grid-template-columns:1fr}}

.progress-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.progress-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:8px;color:#7d8791}
.progress-card b{font-weight:500;color:#111}
.progress-card.ok b{color:#087a45}
.progress-card.wait b{color:#8d96a0}
.progress-card.err b{color:#c62828}
.skeleton{background:linear-gradient(90deg,#f2f4f6 25%,#e7eaee 37%,#f2f4f6 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:10px;min-height:90px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}


/* ===== V16 MOTION SYSTEM ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}
@keyframes drawLine{
  from{stroke-dashoffset:1400}
  to{stroke-dashoffset:0}
}
@keyframes barGrow{
  from{width:0}
}
@keyframes sparkUp{
  from{height:2px;opacity:.3}
  to{opacity:1}
}
@keyframes pulseLive{
  0%,100%{opacity:.55;transform:scale(.85)}
  50%{opacity:1;transform:scale(1.18)}
}
@keyframes softGlow{
  0%,100%{box-shadow:0 10px 35px rgba(16,24,40,.045)}
  50%{box-shadow:0 14px 42px rgba(16,24,40,.09)}
}
@keyframes numberPop{
  0%{opacity:0;transform:translateY(8px) scale(.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* page entrance */
.hero{animation:fadeUp .45s cubic-bezier(.2,.75,.25,1) both}
.filters{animation:fadeUp .45s .06s cubic-bezier(.2,.75,.25,1) both}
.kpi{animation:fadeUp .48s cubic-bezier(.2,.75,.25,1) both}
.kpi:nth-child(1){animation-delay:.05s}
.kpi:nth-child(2){animation-delay:.10s}
.kpi:nth-child(3){animation-delay:.15s}
.kpi:nth-child(4){animation-delay:.20s}

.insight{animation:fadeUp .48s cubic-bezier(.2,.75,.25,1) both}
.insight:nth-child(1){animation-delay:.08s}
.insight:nth-child(2){animation-delay:.13s}
.insight:nth-child(3){animation-delay:.18s}

.panel,.forecast{animation:fadeUp .5s cubic-bezier(.2,.75,.25,1) both}
.forecast-card,.fc{animation:scaleIn .42s cubic-bezier(.2,.75,.25,1) both}
.fc:nth-child(1){animation-delay:.04s}
.fc:nth-child(2){animation-delay:.08s}
.fc:nth-child(3){animation-delay:.12s}
.fc:nth-child(4){animation-delay:.16s}
.fc:nth-child(5){animation-delay:.20s}
.fc:nth-child(6){animation-delay:.24s}

/* values */
.kpi .v,.insight .v,.cnum,.cmp .v,.m .v{
  animation:numberPop .5s ease both;
}

/* chart drawing */
.chart polyline{
  stroke-dasharray:1400;
  stroke-dashoffset:1400;
  animation:drawLine 1.15s cubic-bezier(.2,.75,.25,1) forwards;
}
.chart circle{
  animation:scaleIn .32s ease both;
  transition:r .16s ease,stroke-width .16s ease,filter .16s ease;
  cursor:crosshair;
}
.chart circle:hover{
  r:7;
  stroke:#111;
  stroke-width:2;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.18));
}

/* bars + forecast */
.fill,.rfill{
  animation:barGrow .75s cubic-bezier(.2,.75,.25,1) both;
}
.spark i{
  animation:sparkUp .5s ease both;
}
.spark i:nth-child(2n){animation-delay:.04s}
.spark i:nth-child(3n){animation-delay:.08s}

/* funnel */
.fbar{
  transform-origin:bottom;
  animation:scaleIn .5s cubic-bezier(.2,.75,.25,1) both;
}

/* live pulse */
.live b{
  position:relative;
}
.live b:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#55e7a0;
  margin-right:5px;
  vertical-align:1px;
  animation:pulseLive 1.7s ease-in-out infinite;
}

/* hover microinteractions */
.kpi,.panel,.insight,.channel,.cmp,.fc,.m,.pitem{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
.kpi:hover,.panel:hover,.insight:hover,.channel:hover,.cmp:hover,.fc:hover,.m:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 38px rgba(16,24,40,.10);
}
.pitem:hover{
  transform:translateX(3px);
  border-color:#b8bec5;
  background:#fff;
}
.btn{
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
}
.btn:hover{
  transform:translateY(-1px);
  filter:brightness(.98);
  box-shadow:0 7px 18px rgba(0,0,0,.10);
}
.btn:active{transform:translateY(0) scale(.98)}
td{
  transition:transform .16s ease,filter .16s ease;
}
td:not(:first-child):hover{
  transform:scale(1.07);
  filter:saturate(1.12);
  position:relative;
  z-index:2;
}

/* replay animations whenever render() replaces content */
#app.motion-replay .kpi,
#app.motion-replay .insight,
#app.motion-replay .panel,
#app.motion-replay .forecast,
#app.motion-replay .fc{
  animation-name:fadeUp;
}

/* respect accessibility */
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}


/* ===== V17 RESTORED SUMMARIES ===== */
.flow-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.flow-sum{background:#f8f9fb;border:1px solid #edf0f2;border-radius:11px;padding:9px}
.flow-sum .k{font-size:7px;color:#7f8893}
.flow-sum .v{font-size:14px;font-weight:600;margin-top:3px}
.flow-sum .s{font-size:7px;color:#9aa2ab;margin-top:2px}
.pi-total{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid #edf0f2}
.pi-total .label{font-size:7px;color:#838c96}
.pi-total .value{font-size:20px;font-weight:600;letter-spacing:-.4px}
.pi-total .note{font-size:7px;color:#9aa2ab;margin-top:1px}
@media(max-width:720px){.flow-summary{grid-template-columns:1fr 1fr}}

</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <div><div class="eyebrow">THAI FOODIE FRIEND · FAST ORDER INTELLIGENCE</div><h1>ORDER COMMAND CENTER · V19 WEEKLY FORECAST</h1><div style="font-size:7px;color:#7e8994;margin-top:3px">DEPLOYMENT: …GMHq6n4se94zTNOSp-0H9t · V19 WEEKLY FORECAST</div></div>
      <div class="live"><b>● LIVE API</b><br><span id="updated">กำลังเชื่อมต่อ…</span></div>
    </div>
    <div class="actions"><button class="btn sync" id="sync">↻ Sync Data</button><button class="btn api" id="api">API Core Check</button></div>
  </div>

  <div class="filters">
    <div class="field"><label>ตั้งแต่</label><input id="from" type="date"></div>
    <div class="field"><label>ถึง</label><input id="to" type="date"></div>
    <div class="field"><label>สถานะ</label><select id="status"><option value="all">ออเดอร์ทั้งหมด</option><option value="shipped">ออเดอร์ที่จัดส่งแล้ว</option><option value="success">ออเดอร์สำเร็จ</option><option value="cancelled">ออเดอร์ยกเลิก</option></select></div>
    <div class="field"><label>ช่องทาง</label><select id="platform"><option value="all">ทุกแพลตฟอร์ม</option><option>TikTok แซ่บปะล้ำปะเหลือ</option><option>TikTok แก๊งค์น้องแซ่บ</option><option>Shopee</option><option>Lazada</option></select></div>
  </div>

  <div id="loading" class="loading">กำลังโหลด Core Data จาก Google Sheets…</div>
    <div class="progress-row" id="progress">
      <div class="progress-card wait" id="pCore">Core · <b>รอโหลด</b></div>
      <div class="progress-card wait" id="pProduct">Product · <b>รอโหลด</b></div>
      <div class="progress-card wait" id="pForecast">Forecast · <b>รอโหลด</b></div>
    </div>
  <div id="app" style="display:none"></div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxWJRujcX5ZkrA7e4Hhohc6UpYQiVSHK1ygv84d2ZYbd-GMHq6n4se94zTNOSp-0H9t/exec";
let CORE=null, PRODUCT=null, FORECAST=null, DATA=null, selectedProduct='';

const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(Number(n)||0);
const money=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(Number(n)||0);
const dmy=iso=>{if(!iso)return '—';let m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:iso};
const icon=p=>p.startsWith('TikTok')?'🎵':p==='Shopee'?'🛍️':p==='Lazada'?'🧡':'📦';
const short=p=>p==='TikTok แซ่บปะล้ำปะเหลือ'?'TikTok แซ่บ':p==='TikTok แก๊งค์น้องแซ่บ'?'TikTok แก๊งค์':p;

async function fetchPart(type, params){
  const qs=new URLSearchParams({type});
  Object.entries(params||{}).forEach(([k,v])=>{if(v!==''&&v!=null)qs.set(k,v)});
  const r=await fetch(`${API}?${qs.toString()}`,{method:'GET',redirect:'follow'});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const j=await r.json();
  if(!j.success)throw new Error(j.error||`${type} API Error`);
  return j;
}

function setProgress(id,state,text){
  const el=$(id);
  if(!el)return;
  el.className=`progress-card ${state}`;
  el.innerHTML=`${id==='pCore'?'Core':id==='pProduct'?'Product':'Forecast'} · <b>${text}</b>`;
}

async function load(resetDates=false){

  $('loading').className='loading';
  $('loading').textContent='กำลังโหลด Core Data จาก Google Sheets…';
  $('loading').style.display='block';

  setProgress('pCore','wait','กำลังโหลด');
  setProgress('pProduct','wait','รอ Core');
  setProgress('pForecast','wait','รอ Core');

  const params={
    status:$('status').value,
    platform:$('platform').value
  };

  if($('from').value)params.from=$('from').value;
  if($('to').value)params.to=$('to').value;

  try{

    CORE=await fetchPart('core',params);
    setProgress('pCore','ok','สำเร็จ');

    if(resetDates||!$('from').value)$('from').value=CORE.meta.databaseFrom||CORE.meta.from||'';
    if(resetDates||!$('to').value)$('to').value=CORE.meta.databaseTo||CORE.meta.to||'';

    // ถ้า Core กำหนดวันที่ให้ใหม่ ให้ใช้ช่วงนั้นกับ 2 endpoint ที่เหลือ
    params.from=$('from').value;
    params.to=$('to').value;

    DATA={
      ...CORE,
      sizes:[],
      mushroomFlavors:[],
      chiliMenus:[],
      mushroomHeatmap:{},
      mushroomColumns:[],
      chiliHeatmap:{},
      chiliColumns:[],
      products:[],
      sets:[],
      forecast:[]
    };

    $('updated').textContent=`${fmt(CORE.kpi.orders)} ออเดอร์ · ${dmy(CORE.meta.from)}–${dmy(CORE.meta.to)} · ${CORE.meta.updatedAt}`;

    // แสดง Core ก่อนทันที
    render();
    $('app').style.display='block';
    $('loading').style.display='none';

    setProgress('pProduct','wait','กำลังโหลด');
    setProgress('pForecast','wait','กำลังโหลด');

    const [productResult,forecastResult]=await Promise.allSettled([
      fetchPart('product',params),
      fetchPart('forecast',params)
    ]);

    if(productResult.status==='fulfilled'){
      PRODUCT=productResult.value;
      setProgress('pProduct','ok','สำเร็จ');
    }else{
      PRODUCT=null;
      setProgress('pProduct','err','โหลดไม่สำเร็จ');
      console.error('Product API:',productResult.reason);
    }

    if(forecastResult.status==='fulfilled'){
      FORECAST=forecastResult.value;
      setProgress('pForecast','ok','สำเร็จ');
    }else{
      FORECAST=null;
      setProgress('pForecast','err','โหลดไม่สำเร็จ');
      console.error('Forecast API:',forecastResult.reason);
    }

    DATA={
      ...CORE,
      ...(PRODUCT||{}),
      forecast:FORECAST?.forecast||[]
    };

    render();

  }catch(e){

    setProgress('pCore','err','โหลดไม่สำเร็จ');
    $('loading').className='loading error';
    $('loading').innerHTML=`โหลด Core Data ไม่สำเร็จ: ${e.message}<br><small>V19 ใช้ Deployment …GMHq6n4se94zTNOSp-0H9t · กด API Core Check เพื่อตรวจสอบ API ตัวเดียวกับ Dashboard</small>`;
    $('app').style.display='none';
  }
}

function pct(cur,prev){if(!prev&&!cur)return {t:'0%',c:''};if(!prev)return {t:'+100%',c:'up'};let p=(cur-prev)/prev*100;return {t:`${p>0?'+':''}${p.toFixed(1)}%`,c:p>0?'up':p<0?'down':''}}

function bars(items,n=8){
  items=(items||[]).slice(0,n);let mx=Math.max(1,...items.map(x=>x.value||0));
  return `<div class="ranklist">${items.map((x,i)=>`<div class="rank"><div class="rn">${i+1}</div><div><div class="rname">${x.name}</div><div class="rbar"><div class="rfill" style="width:${(x.value||0)/mx*100}%"></div></div></div><div class="rval">${fmt(x.value)}</div></div>`).join('')}</div>`;
}

function lineChart(data){
  if(!data?.length)return '<div class="sub">ไม่มีข้อมูลในช่วงนี้</div>';
  const W=900,H=280,p={l:42,r:14,t:18,b:35}, keys=['orders','units','revenue'], colors=['#ec0001','#2457d6','#006149'];
  const maxima=keys.map(k=>Math.max(1,...data.map(d=>Number(d[k])||0)));
  const x=i=>p.l+(W-p.l-p.r)*(data.length===1?.5:i/(data.length-1));
  const y=(v,j)=>p.t+(H-p.t-p.b)*(1-v/maxima[j]);
  let grids='';for(let i=0;i<=4;i++){let yy=p.t+(H-p.t-p.b)*i/4;grids+=`<line x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke="#edf0f2"/>`}
  let lines=keys.map((k,j)=>`<polyline points="${data.map((d,i)=>`${x(i)},${y(Number(d[k])||0,j)}`).join(' ')}" fill="none" stroke="${colors[j]}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  let dots=data.map((d,i)=>keys.map((k,j)=>`<circle cx="${x(i)}" cy="${y(Number(d[k])||0,j)}" r="4" fill="${colors[j]}"><title>${dmy(d.date)} · ${k==='orders'?'Orders':k==='units'?'Units':'Revenue'}: ${k==='revenue'?'฿'+money(d[k]):fmt(d[k])}</title></circle>`).join('')).join('');
  let step=Math.max(1,Math.ceil(data.length/9)),labels=data.map((d,i)=>i%step===0||i===data.length-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="8" fill="#8a939d">${dmy(d.date).slice(0,5)}</text>`:'').join('');
  return `<div class="legend"><span><i class="dot" style="background:#ec0001"></i>Orders</span><span><i class="dot" style="background:#2457d6"></i>Units</span><span><i class="dot" style="background:#006149"></i>Revenue</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}">${grids}${lines}${dots}${labels}</svg></div>`;
}

function heat(title,matrix,cols){
  const rows=Object.keys(matrix||{}).map(name=>({name,total:cols.reduce((a,c)=>a+(matrix[name][c]||0),0)})).sort((a,b)=>b.total-a.total);
  let max=1;rows.forEach(r=>cols.forEach(c=>max=Math.max(max,matrix[r.name][c]||0)));
  const cls=v=>!v?'':v/max>.8?'h5':v/max>.6?'h4':v/max>.4?'h3':v/max>.2?'h2':'h1';
  return `<div class="panel heatwrap"><h3>${title}</h3><table><thead><tr><th style="text-align:left">รส / เมนู</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.name}</td>${cols.map(c=>`<td class="${cls(matrix[r.name][c]||0)}">${fmt(matrix[r.name][c]||0)}</td>`).join('')}<td>${fmt(r.total)}</td></tr>`).join('')}</tbody></table></div>`;
}

function forecast(){
  const f=(DATA.forecast||[]).slice(0,6);
  if(!f.length)return '';
  const short=d=>d?d.slice(8,10):'-';
  const dm=d=>d?`${d.slice(8,10)}/${d.slice(5,7)}`:'-';
  const range=(a,b)=>`${dm(a)}–${dm(b)}`;
  return `<div class="section forecast"><div class="title" style="color:#fff;margin:0">FORECAST · WEEKLY MOMENTUM</div><div class="sub" style="color:#9fa9b3">เทียบ 2 สัปดาห์เต็มก่อนหน้า แล้วใช้ % การเติบโตคาดการณ์สัปดาห์ปัจจุบัน</div><div class="forecast-grid">${f.map(x=>{
    let mx=Math.max(1,...(x.values14||[]));
    const w1=x.week1||{units:x.previous7};
    const w2=x.week2||{units:x.current7};
    const tw=x.targetWeek||{};
    const mid=x.forecast7?.mid??0;
    return `<div class="fc"><div class="fcstatus">${x.status}</div><div class="fcname">${x.label}</div><div class="fcg ${x.growth>=0?'up':'down'}">${x.growth>0?'+':''}${x.growth.toFixed(1)}%</div><div class="fcmeta">เทียบ ${range(w1.from,w1.to)}: ${fmt(w1.units||0)} units → ${range(w2.from,w2.to)}: ${fmt(w2.units||0)} units</div><div class="spark">${(x.values14||[]).map(v=>`<i style="height:${Math.max(4,v/mx*100)}%"></i>`).join('')}</div><div class="fcrange">Forecast ${range(tw.from,tw.to)}: <b>${fmt(mid)} units</b>${tw.daysElapsed?` · ตอนนี้ ${fmt(tw.actualUnits||0)} (${Number(tw.progressPct||0).toFixed(0)}%)`:''}</div></div>`;
  }).join('')}</div></div>`;
}

function productExplorer(){
  let items=DATA.products||[];
  return `<div class="section"><div class="title">Product Explorer</div><div class="panel"><div class="product-tools"><input id="search" placeholder="ค้นหาสินค้า..."><select id="sort"><option value="best">ขายดีสุด</option><option value="slow">ขายช้าสุด</option><option value="units">Units สูงสุด</option></select></div><div class="products"><div class="plist" id="plist"></div><div class="pdetail" id="pdetail"></div></div></div></div>`;
}

function drawProducts(){
  const search=$('search'),sort=$('sort'),list=$('plist'),detail=$('pdetail'); if(!search)return;
  const draw=()=>{
    let q=search.value.toLowerCase().trim(),arr=(DATA.products||[]).filter(x=>!q||x.name.toLowerCase().includes(q));
    if(sort.value==='slow')arr.sort((a,b)=>a.quantity-b.quantity);else if(sort.value==='units')arr.sort((a,b)=>b.mainUnits-a.mainUnits);else arr.sort((a,b)=>b.quantity-a.quantity);
    if(!selectedProduct||!arr.some(x=>x.name===selectedProduct))selectedProduct=arr[0]?.name||'';
    list.innerHTML=arr.map(x=>`<div class="pitem ${x.name===selectedProduct?'active':''}" data-name="${encodeURIComponent(x.name)}"><div class="prow"><div class="pname">${x.name}</div><div class="pq">${fmt(x.quantity)}</div></div></div>`).join('');
    list.querySelectorAll('.pitem').forEach(el=>el.onclick=()=>{selectedProduct=decodeURIComponent(el.dataset.name);draw()});
    const p=(DATA.products||[]).find(x=>x.name===selectedProduct);if(!p){detail.innerHTML='<div class="sub">เลือกสินค้า</div>';return}
    detail.innerHTML=`<div style="font-size:10px;font-weight:500;margin-bottom:8px">${p.name}</div><div class="mini"><div class="m"><div class="v">${fmt(p.quantity)}</div><div class="l">SKU / SET</div></div><div class="m"><div class="v">${fmt(p.orders)}</div><div class="l">Orders</div></div><div class="m"><div class="v">${fmt(p.mainUnits)}</div><div class="l">Main Units</div></div><div class="m"><div class="v">${fmt(p.giftUnits)}</div><div class="l">Gift Units</div></div></div><div style="margin-top:10px">${bars(p.flavors||[],12)}</div>`;
  };
  search.oninput=draw;sort.onchange=draw;draw();
}


function flowSummary(data){
  data=data||[];
  const totalOrders=data.reduce((a,x)=>a+(Number(x.orders)||0),0);
  const totalUnits=data.reduce((a,x)=>a+(Number(x.units)||0),0);
  const totalRevenue=data.reduce((a,x)=>a+(Number(x.revenue)||0),0);
  const days=data.length||1;
  const avg=totalOrders/days;
  const peak=[...data].sort((a,b)=>(b.orders||0)-(a.orders||0))[0]||{};
  return `<div class="flow-summary">
    <div class="flow-sum"><div class="k">PEAK DAY</div><div class="v">${dmy(peak.date)} · ${fmt(peak.orders||0)}</div><div class="s">ออเดอร์สูงสุดในวันเดียว</div></div>
    <div class="flow-sum"><div class="k">AVG ORDERS / DAY</div><div class="v">${fmt(avg)}</div><div class="s">${fmt(totalOrders)} orders / ${days} วัน</div></div>
    <div class="flow-sum"><div class="k">TOTAL UNITS</div><div class="v">${fmt(totalUnits)}</div><div class="s">สินค้าหลักในช่วงที่เลือก</div></div>
    <div class="flow-sum"><div class="k">TOTAL REVENUE</div><div class="v">฿${money(totalRevenue)}</div><div class="s">ยอดขายในช่วงที่เลือก</div></div>
  </div>`;
}

function totalOf(items){
  return (items||[]).reduce((a,x)=>a+(Number(x.value)||0),0);
}

function piHeader(title,items,note){
  return `<div class="pi-total"><div><div class="label">${title}</div><div class="note">${note||'ยอดรวมตามช่วง Filter ปัจจุบัน'}</div></div><div class="value">${fmt(totalOf(items))}</div></div>`;
}

function render(){
  const k=DATA.kpi,c=DATA.comparison||{},prev=c.previous||{},d=DATA.daily||[],f=DATA.funnel||{};
  const peak=[...d].sort((a,b)=>b.orders-a.orders)[0]||{},topSize=DATA.sizes?.[0]||{},allFl=[...(DATA.mushroomFlavors||[]),...(DATA.chiliMenus||[])].sort((a,b)=>b.value-a.value),topFl=allFl[0]||{};
  const cmp=[['Orders',k.orders,prev.orders],['Main Units',k.mainUnits,prev.mainUnits],['Gift Units',k.giftUnits,prev.giftUnits],['Revenue',k.revenue,prev.revenue]];
  let maxCh=Math.max(1,...(DATA.channels||[]).map(x=>x.orders));
  const funnelVals=[f.all||0,f.shipped||0,f.success||0,f.cancelled||0],fmax=Math.max(1,...funnelVals);
  $('app').innerHTML=`
  <div class="kpis"><div class="kpi red"><div class="l">ORDERS</div><div class="v">${fmt(k.orders)}</div></div><div class="kpi green"><div class="l">MAIN UNITS</div><div class="v">${fmt(k.mainUnits)}</div></div><div class="kpi blue"><div class="l">GIFT UNITS</div><div class="v">${fmt(k.giftUnits)}</div></div><div class="kpi yellow"><div class="l">REVENUE</div><div class="v">฿${money(k.revenue)}</div></div></div>
  <div class="insights"><div class="insight"><div class="k">PEAK DAY</div><div class="v">${dmy(peak.date)} · ${fmt(peak.orders)} Orders</div><div class="s">วันที่ออเดอร์สูงสุด</div></div><div class="insight"><div class="k">TOP PRODUCT SIZE</div><div class="v">${topSize.name||'—'}</div><div class="s">${fmt(topSize.value)} units</div></div><div class="insight"><div class="k">TOP FLAVOR / MENU</div><div class="v">${topFl.name||'—'}</div><div class="s">${fmt(topFl.value)} units</div></div></div>
  ${forecast()}
  <div class="section grid2"><div class="panel"><h3>LIVE ORDER FLOW</h3>${lineChart(d)}${flowSummary(d)}</div><div class="panel"><h3>CHANNEL MIX</h3><div class="channels">${(DATA.channels||[]).map(x=>`<div class="channel"><div class="crow"><div class="cname">${icon(x.platform)} ${short(x.platform)}</div><div class="cnum">${fmt(x.orders)}</div></div><div class="bar"><div class="fill" style="width:${x.orders/maxCh*100}%"></div></div><div class="cmeta">${fmt(x.mainUnits)} units · ฿${money(x.revenue)}</div></div>`).join('')}</div></div></div>
  <div class="section grid2"><div class="panel"><h3>PERIOD COMPARISON</h3><div class="compare">${cmp.map(([l,cur,pr])=>{let z=pct(cur||0,pr||0);return `<div class="cmp"><div class="v">${l==='Revenue'?'฿'+money(cur):fmt(cur)}</div><div class="l">${l}</div><div class="delta ${z.c}">${z.t} vs previous</div></div>`}).join('')}</div><div class="sub" style="margin-top:7px">ช่วงก่อนหน้า ${dmy(DATA.meta.previousFrom)}–${dmy(DATA.meta.previousTo)}</div></div><div class="panel"><h3>SALES FUNNEL</h3><div class="funnel">${funnelVals.map((v,i)=>`<div class="fstep"><div class="fbar" style="height:${40+90*v/fmax}px">${fmt(v)}</div><div class="flabel">${['ทั้งหมด','จัดส่งแล้ว','สำเร็จ','ยกเลิก'][i]}</div></div>`).join('')}</div></div></div>
  <div class="section"><div class="title">Product Intelligence</div><div class="grid3">
    <div class="panel"><h3>TOP PRODUCT SIZE</h3>${piHeader('TOTAL PRODUCT UNITS',DATA.sizes,'รวมทุกขนาดสินค้า')}${bars(DATA.sizes,7)}</div>
    <div class="panel"><h3>MUSHROOM FLAVOR</h3>${piHeader('TOTAL MUSHROOM UNITS',DATA.mushroomFlavors,'รวมรสชาติเห็ดทั้งหมด')}${bars(DATA.mushroomFlavors,10)}</div>
    <div class="panel"><h3>CHILI MENU</h3>${piHeader('TOTAL CHILI UNITS',DATA.chiliMenus,'รวมเมนูน้ำพริกทั้งหมด')}${bars(DATA.chiliMenus,8)}</div>
  </div></div>
  <div class="section grid2">${heat('FLAVOR × SIZE · เห็ดทอดอบกรอบ',DATA.mushroomHeatmap||{},DATA.mushroomColumns||[])}${heat('MENU × SIZE · น้ำพริก',DATA.chiliHeatmap||{},DATA.chiliColumns||[])}</div>
  <div class="section grid2"><div class="panel"><h3>SET INTELLIGENCE</h3>${bars((DATA.sets||[]).map(x=>({name:x.name,value:x.quantity})),10)}</div><div class="panel"><h3>DATA ENGINE STATUS</h3><div class="mini"><div class="m"><div class="v">${fmt(CORE?.meta?.orderRows ?? DATA?.meta?.orderRows ?? 0)}</div><div class="l">ORDER ROWS</div></div><div class="m"><div class="v">${fmt(CORE?.meta?.stockRows ?? DATA?.meta?.stockRows ?? 0)}</div><div class="l">STOCK MOVEMENTS</div></div><div class="m"><div class="v">${fmt(CORE?.kpi?.products ?? k.products ?? 0)}</div><div class="l">PRODUCTS</div></div><div class="m"><div class="v">${[CORE,PRODUCT,FORECAST].filter(Boolean).length} / 3 ✓</div><div class="l">API MODULES</div></div></div></div></div>
  ${productExplorer()}`;
  drawProducts();

  // replay motion after every refresh/filter change
  const appEl=$('app');
  if(appEl){
    appEl.classList.remove('motion-replay');
    void appEl.offsetWidth;
    appEl.classList.add('motion-replay');
  }
}

$('sync').onclick=()=>load(false);
$('api').onclick=()=>window.open(`${API}?type=core`,'_blank');
['from','to','status','platform'].forEach(id=>$(id).addEventListener('change',()=>load(false)));
load(true);
</script>
</body>
</html>
